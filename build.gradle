// Complicated Bees: Genetic Industry, unofficial NeoForge 26.x port.
// Build one Minecraft target per invocation: -PmcTarget=26.1.2 (default) or -PmcTarget=26.2.
// build-port.ps1 builds both targets with separate project caches.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

def mcTarget = providers.gradleProperty('mcTarget').getOrElse('26.1.2')
if (!(mcTarget in ['26.1.2', '26.2'])) throw new GradleException("Unsupported target: ${mcTarget}")
def neoVersion = mcTarget == '26.1.2' ? '26.1.2.122' : '26.2.0.93'
def jeiVersion = mcTarget == '26.1.2' ? '29.47.0.111' : '30.42.0.237'
def jadeVersion = mcTarget == '26.1.2' ? '26.1.12+neoforge' : '26.2.10+neoforge'

// Complicated Bees dependency: the Complicated Bees 26.x port jar for the same Minecraft target.
// Default location: libs/<minecraft>/complicated_bees-neoforge-*.jar (exactly one).
// Override with -PcbJar=<path to jar>. See README.md, "Complicated Bees dependency".
def cbJar = providers.gradleProperty('cbJar').map { file(it) }.getOrElse(null)
if (cbJar == null) {
    def found = (file("libs/${mcTarget}").listFiles() ?: []).findAll { it.name ==~ /complicated_bees-neoforge-.*\.jar/ }
    if (found.size() != 1) {
        throw new GradleException("Expected exactly one Complicated Bees port jar in libs/${mcTarget}/ (found ${found.size()}). " +
            "Build https://github.com/eriritarded/complicated_bees (branch port/26.x) for ${mcTarget} and copy " +
            "build/${mcTarget}/libs/complicated_bees-neoforge-*.jar there, or pass -PcbJar=<path>.")
    }
    cbJar = found[0]
}
if (!cbJar.isFile()) throw new GradleException("Complicated Bees jar not found: ${cbJar}")
logger.lifecycle("Genetic Industry ${mcTarget}: compiling against ${cbJar.name}")

group = 'com.thesmartnoob880.genindustry_bees'
version = "1.0.0+${mcTarget}-port.2"
base.archivesName = 'genindustry_bees-neoforge'
layout.buildDirectory = file("build/${mcTarget}")
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources.srcDir 'src/generated/resources'
sourceSets.main.resources.srcDir "src/targets/${mcTarget}/resources"
sourceSets.main.java.srcDir "src/targets/${mcTarget}/java"
sourceSets.main.resources.exclude '**/.cache/**'

repositories {
    maven { url = 'https://maven.blamejared.com/' }
    maven { url = 'https://api.modrinth.com/maven' }
}

configurations { runtimeClasspath.extendsFrom localRuntime }

neoForge {
    version = neoVersion
    runs {
        client { client(); gameDirectory = file("run/${mcTarget}/client"); jvmArgument '-Xmx2G'; jvmArgument '-XX:ActiveProcessorCount=4'; programArguments.addAll '--width', '1280', '--height', '900' }
        server { server(); programArgument '--nogui'; gameDirectory = file("run/${mcTarget}/server"); jvmArgument '-Xmx2G'; jvmArgument '-XX:ActiveProcessorCount=4' }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods {
        genindustry_bees { sourceSet(sourceSets.main) }
    }
}

dependencies {
    // Required at runtime too; the jar is a normal NeoForge mod and is discovered on the run classpath.
    implementation files(cbJar)
    compileOnly "mezz.jei:jei-${mcTarget}-common-api:${jeiVersion}"
    compileOnly "mezz.jei:jei-${mcTarget}-neoforge-api:${jeiVersion}"
    if (providers.gradleProperty('withJei').isPresent()) localRuntime "mezz.jei:jei-${mcTarget}-neoforge:${jeiVersion}"
    if (providers.gradleProperty('withJade').isPresent()) localRuntime "maven.modrinth:jade:${jadeVersion}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '3000', '-Xlint:-removal']
}

tasks.named('processResources') {
    // A file under src/targets/<minecraft>/resources replaces the shared file at the same path.
    eachFile { entry ->
        def overlay = file("src/targets/${mcTarget}/resources/${entry.path}")
        if (overlay.isFile() && entry.file.canonicalFile != overlay.canonicalFile) entry.exclude()
    }
    filesMatching('META-INF/neoforge.mods.toml') {
        expand mod_version: project.version, minecraft_version: mcTarget, neo_version: neoVersion
    }
}

tasks.named('jar') { from('LICENSE.txt') }

// Validation harness (dedicated server + connected client), covering this mod and Complicated Bees together.
// Never part of an ordinary build; enabled only with -PvalidatePort or -PclientValidation.
if (providers.gradleProperty('validatePort').isPresent() || providers.gradleProperty('clientValidation').isPresent()) {
    sourceSets {
        validation {
            java.srcDir "src/validation/targets/${mcTarget}/java"
            compileClasspath += sourceSets.main.output + configurations.compileClasspath
            runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
        }
    }
    neoForge.mods { bees_port_validation { sourceSet(sourceSets.validation) } }
    if (providers.gradleProperty('clientValidation').isPresent()) {
        neoForge.runs.configureEach { systemProperty 'bees.validation.client', 'true'; systemProperty 'bees.validation.port', mcTarget == '26.1.2' ? '25661' : '25662' }
    }
}
